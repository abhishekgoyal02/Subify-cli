[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Subify-CLI"
version = "0.1.0"
description = "Developer CLI architecture for subtitle generation and embedding."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0,<14.0",
    "faster-whisper>=1.0,<2.0",
]

[project.scripts]
subify = "subify.cli:main"

[tool.setuptools.packages.find]
include = ["subify*"]
