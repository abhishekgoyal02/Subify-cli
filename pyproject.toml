[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subify-cli"
version = "0.1.0"
description = "Local subtitle generation and embedding CLI with managed FFmpeg setup."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0,<14.0",
    "faster-whisper>=1.0,<2.0",
    "static-ffmpeg>=3.0,<4.0",
]

[project.optional-dependencies]
telegram = []

[project.scripts]
subify = "subify.cli:main"

[tool.setuptools.packages.find]
include = ["subify*", "telegram*"]
